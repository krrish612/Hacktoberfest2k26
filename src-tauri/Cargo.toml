[package]
name = "shutterproof"
version = "0.1.0"
description = "ShutterProof - local-first gear passport and repair-packet tool for solo wedding photographers"
authors = ["ShutterProof"]
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "shutterproof_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Stage 3: talk to a local Ollama server and read receipt documents.
# reqwest is built without TLS and only ever pointed at 127.0.0.1, so no
# certificates or native TLS stacks are pulled in.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
base64 = "0.22"
pdf-extract = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind so a panic inside a third-party PDF parser can be caught and reported
# as an ordinary error instead of aborting the app (see document::pdf_text).
panic = "unwind"
strip = true
